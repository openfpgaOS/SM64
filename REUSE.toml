# ---------------------------------------------------------------------------
# Bulk licensing for files without an inline SPDX header (third-party trees,
# binaries, generated artifacts, packaged distribution, data/config).  Source
# files authored by the project carry their own Apache-2.0 SPDX header and are
# not listed here.  See LICENSES/ for every referenced license text.
# ---------------------------------------------------------------------------
#
# !!! WARNING — READ BEFORE VENDORING ANY THIRD-PARTY TREE !!!
#
# The first [[annotations]] block below uses BARE EXTENSION GLOBS:
#     **/*.json  **/*.md  **/*.bin  **/*.o  **/*.a  **/*.ini  **/*.cfg
# and the "Repository dotfiles" block claims **/.gitignore as CC0
# (c) ThinkElastic.
#
# Those globs are REPO-WIDE.  They match every matching file in every
# subdirectory, INCLUDING vendored third-party trees.  Without an explicit
# carve-out they will silently declare somebody else's data, docs, binaries
# and dotfiles to be this project's own Apache-2.0 / CC0 work.  That is a
# false copyright claim, not merely a lint nit.
#
# ORDERING SEMANTICS: when several [[annotations]] blocks match the same file,
# the LAST matching block wins.  So every vendored tree needs a carve-out
# APPENDED AT THE BOTTOM of this file, after the broad rules.
#
# If you vendor a new third-party tree, add a bottom carve-out for it that:
#   1. sets a default rule for   "<tree>/**"
#   2. adds explicit rules for its dotfiles, so the CC0 "**/.gitignore" rule
#      above cannot claim them
#   3. re-claims, LAST, only the files this project actually authored inside
#      that tree
#
# The src/sm64/sm64/ carve-out at the end of this file is the worked example.
# ---------------------------------------------------------------------------

# ===== Project data / docs / build outputs / packaged distribution =========
[[annotations]]
path = [
    "runtime/**",
    "dist/**",
    "build/**",
    "**/*.o",
    "**/*.a",
    "**/*.json",
    "**/*.ini",
    "**/*.cfg",
    "**/*.bin",
    "**/*.sof",
    "**/*.rbf_r",
    "**/*.iso",
    "**/*.md",
    "src/apps/fbdemo/ofos.png",
    "src/apps/wavdemo/audio.wav",
    "NOTICE",
]
SPDX-FileCopyrightText = "(c) 2026, ThinkElastic <Think@Elastic.com>"
SPDX-License-Identifier = "Apache-2.0"

# ===== Root docs that QUOTE other people's copyright notices ================
# README.md, NOTICE and DISTRIBUTION.md all reproduce third-party copyright
# lines ("(c) 1996 Nintendo Co., Ltd.", "(c) 2020 Emill, MaikelChan",
# "Copyright 1995, Silicon Graphics, Inc. ...") as part of their attribution
# text.  Without precedence = "override" the REUSE tooling scrapes those quoted
# lines out of the file body and reports them AS the file's own copyright
# holders -- i.e. the generated SBOM would claim these are Apache-2.0 works of
# Nintendo/SGI/Emill.  They are ThinkElastic's own prose ABOUT those works.
# Any future doc that quotes an upstream copyright line must be added here.
[[annotations]]
path = ["README.md", "NOTICE", "DISTRIBUTION.md"]
precedence = "override"
SPDX-FileCopyrightText = "(c) 2026, ThinkElastic <Think@Elastic.com>"
SPDX-License-Identifier = "Apache-2.0"

# ===== Repository dotfiles ==================================================
[[annotations]]
path = ["**/.gitignore", ".gitmodules"]
precedence = "override"
SPDX-FileCopyrightText = "(c) 2026, ThinkElastic <Think@Elastic.com>"
SPDX-License-Identifier = "CC0-1.0"

