# and headers, asm/, actors/, levels/, data/, text/, bin/, assets/, sound/,
# assets.json (a retail-ROM offset table), sound/sequences.json,
# sound/sound_banks/*.json, media/ screenshots, and anything else not
# re-classified by a later block.  No rights holder has granted any license.
# NOTE: no copyrightable ROM media is committed here; it is extracted at build
# time from the builder's own baserom.us.z64 (which .gitignore excludes).
[[annotations]]
