# --- 3. Nintendo 64 SDK material (SGI / Nintendo) ---------------------------
# include/PR/*.h carry a verbatim "Copyright (C) 1994, Silicon Graphics, Inc.
# ... unpublished proprietary information ... may not be disclosed to third
# parties or copied or duplicated in any form" notice -- an explicit
# reservation of rights, the opposite of a grant.
# lib/PR/**/*.bin were 24 unmodified Nintendo RSP microcode BINARIES; e.g.
# `strings lib/PR/f3dex/F3DEX_NoN_data.bin` yielded
# "RSP Gfx ucode F3DEX.NoN     1.23 Yoshitaka Yasumoto Nintendo."
# tools/sdk-tools/README.md: "Decompilation of the Nintendo 64 SDK developer
# tools".
# NOTE: this block is placed AFTER block 2 on purpose -- tools/sdk-tools/**
# sits under tools/** and must not fall through to the port-authored rule.
# NOTE: lib/PR/**, lib/rsp.s and rsp/** were deleted from the index while this
# carve-out was being written.  Their rules are kept deliberately: a REUSE.toml
# path that matches nothing is harmless, and keeping them means the rules are
# already correct if those paths ever come back.  (Deleting the files from the
# tip does NOT remove them from git history.)
[[annotations]]
path = [
    "src/sm64/sm64/include/PR/**",
    "src/sm64/sm64/lib/PR/**",
    "src/sm64/sm64/lib/asm/**",
    "src/sm64/sm64/lib/src/**",
    "src/sm64/sm64/lib/rsp.s",
    "src/sm64/sm64/rsp/**",
    "src/sm64/sm64/tools/sdk-tools/**",
]
precedence = "override"
SPDX-FileCopyrightText = "(c) Silicon Graphics, Inc. and/or Nintendo Co., Ltd. -- all rights reserved. NOT a work of ThinkElastic."
SPDX-License-Identifier = "LicenseRef-N64SDK-NoLicense"

