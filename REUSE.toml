#   d3dcommon.h                     MIDL-generated, no copyright line at all
# No license text for these three is vendored and none is stated in-tree.
[[annotations]]
path = "src/sm64/sm64/src/pc/gfx/dxsdk/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Microsoft Corporation -- Direct3D 12 headers from the Windows SDK. NOT a work of ThinkElastic, Emill or MaikelChan."
